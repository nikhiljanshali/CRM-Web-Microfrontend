<title>Notifications</title>
<div class="notificationList-wrap">
    <div id="wrapper">
        <div class="row container-fluid">
            <div class="middle-content p-0 d-shadow">
                <div class="middle-wrap row wb">
                    <div class="e-left w-100 pr-0">
                        <div class="company-info">
                            <div class="col-xl-12 col-lg-12 col-sm-12 col-xs-12 p-0 ci-title ci-top">
                                <div class="ci-top-left">
                                    <ul>
                                        <li class="breadcrumb-item k-cursor-pointer" routerLink="/"><i
                                                class="icon-home"></i>Home</li>
                                        <li class="breadcrumb-item active" aria-current="page">Notifications</li>
                                    </ul>
                                </div>
                            </div>

                            <div class="col-xl-12 col-lg-12 col-sm-12 col-xs-12 p-0 ci-title">
                                <div class="ci-top-right">
                                    <kendo-buttongroup kendoTooltip position="bottom">
                                        <button kendoButton title="Delete notification"
                                            [disabled]="mySelection.length == 0"
                                            (click)="deleteNotificationReasonDialog()"><i
                                                class="icon-trash"></i></button>
                                    </kendo-buttongroup>
                                </div>
                            </div>
                            <div class="grid-wrap grid-summury">
                                <!-- Skeleton start -->
                                <ng-container *ngIf="!gridView">
                                    <div class="k-grouping-header k-grouping-header-flex">
                                        <div class="k-indicator-container">
                                            <kendo-skeleton shape="text" animation="wave" [width]="400" [height]="40">
                                            </kendo-skeleton>
                                        </div>
                                    </div>
                                    <table *ngIf="fields && fields.length > 0" class="w-100">
                                        <th *ngFor="let field of fields">{{field.propertyName}}</th>
                                        <tr *ngFor="let field of skeletonArray">
                                            <td *ngFor="let field of fields">
                                                <kendo-skeleton shape="text" animation="wave" [width]="75"
                                                    [height]="40">
                                                </kendo-skeleton>
                                            </td>
                                        </tr>
                                    </table>
                                </ng-container>
                                <!-- Skeleton end -->

                                <kendo-grid #notifictionGrid *ngIf="gridView" [data]="gridView" [reorderable]="true"
                                    [resizable]="true" [groupable]="true" [sortable]="true" (dblclick)="dblClickNotification()"
                                    [selectable]="selectableSettings" (selectionChange)="selectedRowChange($event)"
                                    [group]="groups" (groupChange)="groupChange($event)" [pageSize]="pageSize"
                                    [skip]="skip" [pageable]="true" (pageChange)="pageChange($event)"
                                    [selectedKeys]="mySelection" [kendoGridSelectBy]="'id'">
                                    <ng-container *ngIf="fields && fields.length > 0">
                                        <ng-container *ngFor="let field of fields">
                                            <ng-container *ngIf="field.isSelected">
                                                <kendo-grid-column [width]="field.width" [field]="field.propertyName"
                                                    [title]="field.title">
                                                    <ng-template kendoGridCellTemplate let-dataItem
                                                        *ngIf="field.propertyName == 'senderId'">
                                                        {{dataItem.senderName}}
                                                    </ng-template>
                                                    <ng-template kendoGridCellTemplate let-dataItem
                                                        *ngIf="field.propertyName == 'receiverId'">
                                                        {{dataItem.receiverName}}
                                                    </ng-template>
                                                    <ng-template kendoGridCellTemplate let-dataItem
                                                        *ngIf="field.propertyName == 'createdDate'">
                                                        {{dataItem.createdDate | date: 'dd-MM-yyyy hh:mm:ss a'}}
                                                    </ng-template>
                                                </kendo-grid-column>
                                            </ng-container>
                                        </ng-container>
                                    </ng-container>
                                </kendo-grid>
                            </div>
                        </div>
                    </div>
                    <!-- <div class="f-btn" [ngClass]="{'active': filterFlag}">
                        <ul>
                            <li><button class="open-filter" (click)="filterPartToggle()"><i
                                        class="icon-filter"></i></button></li>
                            <li><button><i class="icon-search"></i></button></li>
                            <li><button><i class="icon-clear"></i></button></li>
                        </ul>
                    </div> -->
                </div>
            </div>
        </div>
    </div>

    <ng-container *ngIf="notificationActionMStoneFlag">
        <app-manualstoneissue [notificationObj]="notificationObj" (toggle)="notificationActionMStoneFlag=$event">
        </app-manualstoneissue>
  </ng-container>

    <div kendoDialogContainer></div>
