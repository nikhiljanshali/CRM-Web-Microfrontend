<div class="modal c-modal" tabindex="-1" role="dialog" data-keyboard="false" data-backdrop="static">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="main-title">
        <h5>{{mediaTitle}}</h5>
        <button type="button" class="close" (click)="closeMediaDialog()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div *ngIf="mediaType == 'img'">
          <div class="content">
            <img
              [src]="sanitizeURL((mediaSrc != null && mediaSrc.length > 0) ? mediaSrc : 'commonAssets/images/still.jpg')"
              alt="diamond image" style="width: 100%;height: auto;" />
          </div>
        </div>
        <div *ngIf="mediaType == 'cert'">
          <div class="content">
            <!-- <img
              [src]="sanitizeURL((mediaSrc != null && mediaSrc.length > 0) ? mediaSrc : 'commonAssets/images/GIA_Cert.png')"
              alt="diamond certificate" style="width: 100%;height: auto;" /> -->
            <iframe
              [src]="sanitizeURL((mediaSrc != null && mediaSrc.length > 0) ? mediaSrc : 'commonAssets/images/image-not-found.jpg')"
              width="100%" height="588px" style="border: 0;" allow='autoplay'></iframe>
          </div>
        </div>
        <div *ngIf="mediaType == 'iframe'">
          <iframe
            [src]="sanitizeURL((mediaSrc != null && mediaSrc.length > 0) ? mediaSrc : 'https://diamdna.com/Vision360.html?d=fl-116&sr=-30&s=30')"
            style="width: 100%;height: 420px;border:0;"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<div (document:keydown.esc)="closeMediaDialog()"></div>
