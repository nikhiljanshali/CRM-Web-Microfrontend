<title>Business Configuration</title>
<div class="ms-config-wrap">
    <div id="wrapper">
        <div class="row container-fluid">
            <div class="middle-content p-0 d-shadow">
                <div class="breadcrumb">
                    <ul>
                        <li class="breadcrumb-item">
                            <a href="#"></a><i class="icon-home"></i> Home
                        </li>
                        <li class="breadcrumb-item active" aria-current="page">Business Config</li>
                    </ul>
                </div>
                <div class="ms-config">
                    <div class="col-lg-12 col-xs-12 col-12">
                        <div class="row">
                            <!-- #region Qc Reasons -->
                            <div class="col-xl-6 col-lg-6 col-sm-12 col-md-12 col-xs-12 plr-5 mt-3">
                                <div class="ac-config-title">
                                    <h6>Qc Reasons</h6>
                                    <form name="form" #QcForm="ngForm">
                                        <div class="d-prop-wrap m-2">
                                            <div class="flex in-block">
                                                <div class="o-title" style="flex-basis: 100%;">
                                                    <div class="align-items-center h-reason">
                                                        <div class="f-group mr-1"
                                                            [ngClass]="{ 'error': qcReason.invalid && (qcReason.dirty || qcReason.touched)}">
                                                            <input type="text" [(ngModel)]="qcReasonModel"
                                                                name="qcReason" #qcReason="ngModel" id="" required>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="o-edit">
                                                    <button class="btn" *ngIf="!editQcReason"
                                                        (click)="onReasonNameSubmit(QcForm,'qcreason')"
                                                        [disabled]="!QcForm.valid" title="Add Qc Reason"><i
                                                            class="icon-add"></i></button>
                                                </div>
                                                <div class="o-edit">
                                                    <button class="btn" *ngIf="editQcReason"
                                                        (click)="onReasonNameSubmit(QcForm,'qcreason')"
                                                        [disabled]="!QcForm.valid" title="Update Qc Reason"><i
                                                            class="icon-edit"></i></button>
                                                </div>
                                                <div class="o-edit">
                                                    <button class="btn" *ngIf="editQcReason"
                                                        (click)="clearReasonName('qcreason')"><i class="icon-delete"
                                                            title="Clear"></i></button>
                                                </div>
                                            </div>
                                            <div class="d-prop">
                                                <ul *ngIf="businessConfig && businessConfig?.qcReasons">
                                                    <li *ngFor="let item of businessConfig.qcReasons;let index = index">
                                                        <div class="flex">
                                                            <div class="o-title" style="flex: 0 96%;">
                                                                <span class="title">{{item}}</span>
                                                            </div>
                                                            <div class="o-edit text-right" style="flex: 0 6%;">
                                                                <button class="btn"
                                                                    (click)="editReasonNameDialog(item,index,'qcreason')"><i
                                                                        class="icon-edit" title="Edit"></i></button>
                                                                <button class="btn"
                                                                    (click)="deleteReasonNameDialog(item,index,'qcreason')"><i
                                                                        class="icon-trash" title="Delete"></i></button>
                                                            </div>
                                                        </div>
                                                    </li>
                                                </ul>
                                                <div class="text-center m-2"
                                                    *ngIf="!businessConfig?.qcReasons || businessConfig?.qcReasons?.length == 0">
                                                    <p>No Data Found</p>
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                            <!-- #endregion -->

                            <!-- #region Stone Remove reason -->
                            <div class="col-xl-6 col-lg-6 col-sm-12 col-md-12 col-xs-12 pr-0 mt-3">
                                <div class="ac-config-title">
                                    <h6>Remove-Stone Reasons</h6>
                                    <form name="form" #RsForm="ngForm">
                                        <div class="d-prop-wrap m-2">
                                            <div class="flex in-block">
                                                <div class="o-title" style="flex-basis: 100%;">
                                                    <div class="align-items-center h-reason">
                                                        <div class="f-group mr-1"
                                                            [ngClass]="{ 'error': stoneRemoveReason.invalid && (stoneRemoveReason.dirty || stoneRemoveReason.touched)}">
                                                            <input type="text" [(ngModel)]="removeStoneReasonModel"
                                                                name="stoneRemoveReason" #stoneRemoveReason="ngModel"
                                                                id="" required>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="o-edit">
                                                    <button class="btn" *ngIf="!editRSReason"
                                                        (click)="onReasonNameSubmit(RsForm,'rsreason')"
                                                        [disabled]="!RsForm.valid" title="Add RS Reason"><i
                                                            class="icon-add"></i></button>
                                                </div>
                                                <div class="o-edit">
                                                    <button class="btn" *ngIf="editRSReason"
                                                        (click)="onReasonNameSubmit(RsForm,'rsreason')"
                                                        [disabled]="!RsForm.valid" title="Update RS Reason"><i
                                                            class="icon-edit"></i></button>
                                                </div>
                                                <div class="o-edit">
                                                    <button class="btn" *ngIf="editRSReason"
                                                        (click)="clearReasonName('rsreason')"><i class="icon-delete"
                                                            title="Clear"></i></button>
                                                </div>
                                            </div>
                                            <div class="d-prop">
                                                <ul *ngIf="businessConfig && businessConfig?.removeStoneReasons">
                                                    <li
                                                        *ngFor="let item of businessConfig.removeStoneReasons;let index = index">
                                                        <div class="flex">
                                                            <div class="o-title" style="flex: 0 96%;">
                                                                <span class="title">{{item}}</span>
                                                            </div>
                                                            <div class="o-edit text-right" style="flex: 0 6%;">
                                                                <button class="btn"
                                                                    (click)="editReasonNameDialog(item,index,'rsreason')"><i
                                                                        class="icon-edit" title="Edit"></i></button>
                                                                <button class="btn"
                                                                    (click)="deleteReasonNameDialog(item,index,'rsreason')"><i
                                                                        class="icon-trash" title="Delete"></i></button>
                                                            </div>
                                                        </div>
                                                    </li>
                                                </ul>
                                                <div class="text-center m-2"
                                                    *ngIf="!businessConfig?.removeStoneReasons || businessConfig?.removeStoneReasons?.length == 0">
                                                    <p>No Data Found</p>
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                            <!-- #endregion -->

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div kendoDialogContainer></div>
