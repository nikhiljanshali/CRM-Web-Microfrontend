<title>Organization Configuration</title>
<div class="or-config-wrap">
  <div id="wrapper">
    <div class="row container-fluid">
      <div class="middle-content p-0 d-shadow">
        <form name="orgConfigForm" #orgConfigForm="ngForm" novalidate>
          <div class="company-info">
            <div class="col-xl-12 col-lg-12 col-sm-12 col-xs-12 p-0 ci-title">
              <div class="ci-top-left">
                <ul>
                  <li class="breadcrumb-item"><a href="#"></a><i class="icon-home"></i>Home</li>
                  <li class="breadcrumb-item active" aria-current="page">
                    {{orgConfig?.organizationDNorm?.name}}'s Configurations</li>
                </ul>
              </div>
              <div class="ci-top-right">
              </div>
            </div>
          </div>
          <div class="or-config ms-config">
            <div class="row">
              <div class="col-xl-12 col-lg-12 col-sm-12 col-md-12 col-xs-12 plr-5">
                <div class="i-form ed-top">
                  <div class="row">
                    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
                      <div class="d-prop-wrap">
                        <div class="flex in-block">
                          <div class="o-title">
                            <h6 class="title">Manage URL</h6>
                          </div>
                          <div class="o-edit" kendoTooltip position="bottom">
                            <button type="button" kendoButton title="Edit Configuration" [disabled]="isUrlEditable"
                              (click)="enableUrlSaveChanges()"><i class="icon-edit"></i></button>
                            <button type="button" kendoButton title="Save Configuration"
                              [disabled]="!isUrlEditable || !orgConfigForm.valid" (click)="submit(orgConfigForm, 1)"><i
                                class="icon-save"></i></button>
                            <button type="button" kendoButton title="Disabled Configuration" [disabled]="!isUrlEditable"
                              (click)="disabledUrlConfiguration()"><i class="icon-delete"></i></button>
                          </div>
                        </div>
                        <div class="wrd row">
                          <div class="col-xl-4 col-lg-4 col-sm-4 col-md-4 col-xs-12">
                            <div class="form-data"
                              [ngClass]="{ 'error': imageUrl.invalid && (imageUrl.hasError('pattern') || imageUrl.dirty || imageUrl.touched)}">
                              <span class="u-title">Image URL</span>
                              <input type="text" name="imageUrl" [(ngModel)]="orgConfig.imageUrl" #imageUrl="ngModel"
                                id="imageUrl" required placeholder="Enter URL" [disabled]="!isUrlEditable"
                                [pattern]="websitePattern" [ngClass]="{'active':isUrlEditable}">
                            </div>
                          </div>
                          <div class="col-xl-4 col-lg-4 col-sm-4 col-md-4 col-xs-12">
                            <div class="form-data"
                              [ngClass]="{ 'error': videoUrl.invalid && (videoUrl.hasError('pattern') || videoUrl.dirty || videoUrl.touched)}">
                              <span class="u-title">Video URL</span>
                              <input type="text" name="videoUrl" [(ngModel)]="orgConfig.videoUrl" #videoUrl="ngModel"
                                id="videoUrl" required placeholder="Enter URL" [disabled]="!isUrlEditable"
                                [pattern]="websitePattern" [ngClass]="{'active':isUrlEditable}">
                            </div>
                          </div>
                          <div class="col-xl-4 col-lg-4 col-sm-4 col-md-4 col-xs-12">
                            <div class="form-data"
                              [ngClass]="{ 'error': certificateUrl.invalid && (certificateUrl.hasError('pattern') || certificateUrl.dirty || certificateUrl.touched)}">
                              <span class="u-title">Certificate URL</span>
                              <input type="text" name="certificateUrl" [(ngModel)]="orgConfig.certificateUrl" #certificateUrl="ngModel"
                                id="certificateUrl" required placeholder="Enter URL" [disabled]="!isUrlEditable"
                                [pattern]="websitePattern" [ngClass]="{'active':isUrlEditable}">
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-xl-4 col-lg-4 col-sm-4 col-md-4 col-xs-12 plr-5">
                <div class="i-form ed-top">
                  <div class="row">
                    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
                      <div class="d-prop-wrap">
                        <div class="flex in-block">
                          <div class="o-title">
                            <h6 class="title">API-Path Configuration</h6>
                          </div>
                          <div class="o-edit" kendoTooltip position="bottom">
                            <button type="button" kendoButton title="Edit Configuration" [disabled]="isApiEditable"
                              (click)="enableSaveChanges()"><i class="icon-edit"></i></button>
                            <button type="button" kendoButton title="Save Configuration"
                              [disabled]="!isApiEditable || !orgConfigForm.valid" (click)="submit(orgConfigForm, 2)"><i
                                class="icon-save"></i></button>
                            <button type="button" kendoButton title="Disabled Configuration" [disabled]="!isApiEditable"
                              (click)="disabledConfiguration()"><i class="icon-delete"></i></button>
                          </div>
                        </div>
                        <div class="wrd grid">
                          <div class="form-data"
                            [ngClass]="{ 'error': apiPath.invalid && (apiPath.hasError('pattern') || apiPath.dirty || apiPath.touched)}">
                            <input type="text" name="apiPath" [(ngModel)]="orgConfig.apiPath" #apiPath="ngModel"
                              id="apiPath" required placeholder="Enter URL" [disabled]="!isApiEditable"
                              [pattern]="websitePattern" [ngClass]="{'active':isApiEditable}">
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div kendoDialogContainer></div>
