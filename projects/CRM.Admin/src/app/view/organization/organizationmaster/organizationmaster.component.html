<title>Organizations</title>
<div class="omaster-wrap">
  <div id="wrapper">
    <div class="row container-fluid">
      <div class="middle-content p-0 d-shadow">
        <div class="middle-wrap row wb">
          <div class="e-left">
            <div class="company-info">
              <div class="col-xl-12 col-lg-12 col-sm-12 col-xs-12 p-0 ci-title ci-top">
                <div class="ci-top-left">
                  <ul>
                    <li class="breadcrumb-item"><a href="#"></a><i class="icon-home"></i>Home</li>
                    <li class="breadcrumb-item active" aria-current="page">Organizations</li>
                  </ul>
                </div>
                <div class="ci-top-right">
                  <kendo-buttongroup kendoTooltip position="bottom">
                    <button kendoButton (click)="openAddOrgDialog()" title="Add Organization"><i
                        class="icon-add"></i></button>
                    <button [disabled]="insertFlag" kendoButton (click)="openUpdateOrgDialog()"
                      title="Edit Organization"> <i class="icon-edit"></i></button>
                    <button [disabled]="insertFlag" kendoButton (click)="openOrgRedirect('details')"
                      title="View Details"><i class="icon-viewdetilas"></i></button>
                    <button [disabled]="insertFlag" kendoButton (click)="openOrgRedirect('configurations')"
                      title="Configuration"><i class="icon-setting"></i></button>
                    <button [disabled]="insertFlag" kendoButton (click)="openDeleteDialog()" title="Delete"><i
                        class="icon-trash"></i></button>
                    <button kendoButton (click)="openGridConfigDialog()" title="Grid Configuration"><i
                        class="icon-gridconfig"></i></button>
                  </kendo-buttongroup>
                </div>
              </div>
            </div>
            <div class="grid-wrap">

              <!-- Skeleton start -->
              <ng-container *ngIf="!gridView">
                <div class="k-grouping-header k-grouping-header-flex">
                  <div class="k-indicator-container">
                    <kendo-skeleton shape="text" animation="wave" [width]="400" [height]="40">
                    </kendo-skeleton>
                  </div>
                </div>
                <table *ngIf="fields && fields.length > 0" class="w-100 table-responsive skeleton-tbl">
                  <ng-container *ngFor="let field of fields">
                    <th *ngIf="field.isSelected">
                      {{field.title}}
                    </th>
                  </ng-container>
                  <tr *ngFor="let field of skeletonArray">
                    <ng-container *ngFor="let fieldItem of fields">
                      <td *ngIf="fieldItem.isSelected">
                        <kendo-skeleton shape="text" animation="wave" [width]="80" [height]="40">
                        </kendo-skeleton>
                      </td>
                    </ng-container>
                  </tr>
                </table>
              </ng-container>
              <!-- Skeleton end -->

              <kendo-grid #orgGrid *ngIf="gridView" [data]="gridView" [reorderable]="true" [resizable]="true"
                [groupable]="true" [sortable]="true" [selectable]="selectableSettings"
                (selectionChange)="selectedRowChange($event)" [group]="groups" (groupChange)="groupChange($event)"
                [pageSize]="pageSize" [skip]="skip" [pageable]="true" (pageChange)="pageChange($event)"
                [selectedKeys]="mySelection" [kendoGridSelectBy]="'id'">
                <ng-container *ngIf="fields && fields.length > 0">
                  <ng-container *ngFor="let field of fields">
                    <ng-container *ngIf="field.isSelected">
                      <kendo-grid-column [width]="field.width" [field]="field.propertyName" [title]="field.title">
                        <ng-template kendoGridCellTemplate let-dataItem *ngIf="field.propertyName=='mobileNo'">
                          <span>{{dataItem.mobileNo | numberfilter:'mobile'}}</span>
                        </ng-template>
                        <ng-template kendoGridCellTemplate let-dataItem *ngIf="field.propertyName=='phoneNo'">
                          <span>{{dataItem.phoneNo | numberfilter:'phone'}}</span>
                        </ng-template>
                        <ng-template kendoGridCellTemplate let-dataItem *ngIf="field.propertyName=='faxNo'">
                          <span>{{dataItem.faxNo | numberfilter:'fax'}}</span>
                        </ng-template>
                      </kendo-grid-column>
                    </ng-container>
                  </ng-container>
                </ng-container>
              </kendo-grid>
            </div>
          </div>

          <!-- Search start -->
          <div class="e-right">
            <div class="sr-wrap" [ngClass]="{'active': filterFlag}">
              <div class="sr">
                <h6>Search By Filter</h6>
                <form name="form" #orgSearchForm="ngForm" novalidate>
                  <div class="i-form">
                    <div class="row">
                      <div class="col-xl-12 col-lg-12 col-sm-12 col-xs-12 form-data">
                        <label for="">Name</label>
                        <input type="text" id="" name="filtername" [(ngModel)]="organizationCriteria.name"
                          #filtername="ngModel">
                      </div>
                      <div class="col-xl-12 col-lg-12 col-sm-12 col-xs-12 form-data">
                        <label>Organization Type</label>
                        <kendo-dropdownlist [data]="listOrgTypeItems" [valuePrimitive]="true"
                          name="filterOrganizationType" [(ngModel)]="organizationCriteria.organizationType"
                          #filterOrganizationType="ngModel">
                        </kendo-dropdownlist>
                      </div>
                      <div class="col-xl-12 col-lg-12 col-sm-12 col-xs-12 form-data">
                        <label>Business Type</label>
                        <kendo-dropdownlist [data]="listBusinessTypeItems" name="filterBusinessType"
                          [valuePrimitive]="true" [(ngModel)]="organizationCriteria.businessType"
                          #filterBusinessType="ngModel">
                        </kendo-dropdownlist>
                      </div>
                      <div class="col-xl-12 col-lg-12 col-sm-12 col-xs-12 form-data">
                        <label for="l-name">Registration No</label>
                        <input type="text" id="l-name" name="filterRegistrationNo"
                          [(ngModel)]="organizationCriteria.registrationNo" #filterRegistrationNo="ngModel">
                      </div>
                      <div class="col-xl-12 col-lg-12 col-sm-12 col-xs-12 form-data">
                        <label>Country</label>
                        <kendo-dropdownlist [data]="countryItems" [kendoDropDownFilter]="filterSettings"
                          [textField]="'name'" [valueField]="'name'" name="filterCountry" #filterCountry="ngModel"
                          [valuePrimitive]="true" [(ngModel)]="organizationCriteria.country">
                        </kendo-dropdownlist>
                      </div>
                      <div class="col-xl-12 col-lg-12 col-sm-12 col-xs-12 form-data">
                        <label for="">Email Id</label>
                        <input type="mail" id="" name="filterEmail" [(ngModel)]="organizationCriteria.email"
                          #filterEmail="ngModel">
                      </div>
                      <div class="col-xl-12 col-lg-12 col-sm-12 col-xs-12 form-data social">
                        <button class="btn btn-action"
                          (click)="orgSearchForm.form.valid && onFilterSubmit(orgSearchForm)">
                          <i class="icon-search"></i>Search
                        </button>
                        <button (click)="clearFilter(orgSearchForm)" class="btn btn-action">
                          <i class="icon-clear"></i>Clear
                        </button>
                      </div>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <!-- Search End -->
        </div>
        <div class="f-btn" [ngClass]="{'active': filterFlag}">
          <ul>
            <li><button class="open-filter" (click)="filterPartToggle()"><i class="icon-filter"></i></button></li>
            <li><button (click)="orgSearchForm.form.valid && onFilterSubmit(orgSearchForm)"><i
                  class="icon-search"></i></button></li>
            <li><button (click)="clearFilter(orgSearchForm)"><i class="icon-clear"></i></button></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Register Organization Modal Start -->
<div class="modal c-modal addemp rorgan" tabindex="-1" role="dialog" data-keyboard="false" data-backdrop="static"
  *ngIf="isRegOrganization">
  <form name="form" #organizationForm="ngForm">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalCenterTitle"><i class="icon-candidates"></i>Register
            Organization</h5>
          <button type="button" class="close" (click)="closeRegOrganDialog(organizationForm)">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-xl-12 col-lg-12 col-sm-12 col-xs-12">
              <div class="i-form ro-grid">
                <h6 class="title"><i class="icon-candidates"></i>Organization Information</h6>
                <div class="grid">
                  <div class="form-data">
                    <label for="">Name<span class="require">*</span></label>
                  </div>
                  <div class="form-data" [ngClass]="{ 'error': name.invalid && (name.dirty || name.touched)}">
                    <input type="text" name="name" [(ngModel)]="organizationObj.name" #name="ngModel" id="" required>
                  </div>
                  <div class="form-data">
                    <label>Origin<span class="require">*</span></label>
                  </div>
                  <div class="form-data" [ngClass]="{ 'error': origin.invalid && (origin.dirty || origin.touched) }">
                    <kendo-dropdownlist [data]="listOriginItems" [valuePrimitive]="true" name="origin"
                      [(ngModel)]="organizationObj.origin" #origin="ngModel" required>
                    </kendo-dropdownlist>
                  </div>
                  <div class="form-data">
                    <label>Org.Type<span class="require">*</span></label>
                  </div>
                  <div class="form-data"
                    [ngClass]="{ 'error': organizationType.invalid && (organizationType.dirty || organizationType.touched)}">
                    <kendo-dropdownlist [data]="listOrgTypeItems" [valuePrimitive]="true" name="organizationType"
                      [(ngModel)]="organizationObj.organizationType" #organizationType="ngModel" required>
                    </kendo-dropdownlist>
                  </div>
                  <div class="form-data">
                    <label>BusinessType<span class="require">*</span></label>
                  </div>
                  <div class="form-data"
                    [ngClass]="{ 'error': businessType.invalid && (businessType.dirty || businessType.touched)}">
                    <kendo-dropdownlist [data]="listBusinessTypeItems" name="businessType" [valuePrimitive]="true"
                      [(ngModel)]="organizationObj.businessType" #businessType="ngModel" required>
                    </kendo-dropdownlist>
                  </div>
                  <div class="form-data">
                    <label for="">Regi. No</label>
                  </div>
                  <div class="form-data">
                    <input type="text" id="" name="registrationNo" #registrationNo="ngModel"
                      [(ngModel)]="organizationObj.registrationNo">
                  </div>
                  <div class="form-data">
                    <label for="">Inc. Tax No</label>
                  </div>
                  <div class="form-data">
                    <input type="text" id="" name="incomeTaxNo" #incomeTaxNo="ngModel"
                      [(ngModel)]="organizationObj.incomeTaxNo">
                  </div>
                  <div class="form-data">
                    <label for="">GST No</label>
                  </div>
                  <div class="form-data">
                    <input type="text" id="" name="gstNo" #gstNo="ngModel" [(ngModel)]="organizationObj.gstNo">
                  </div>
                  <div class="form-data">
                    <label>Membership</label>
                  </div>
                  <div class="form-data">
                    <kendo-dropdownlist [data]="listMembershipItems" name="membership" #membership="ngModel"
                      [valuePrimitive]="true" [(ngModel)]="organizationObj.membership">
                    </kendo-dropdownlist>
                  </div>
                  <div class="form-data">
                    <label for="">Website</label>
                  </div>
                  <div class="form-data"
                    [ngClass]="{ 'error': website.invalid && ((website.touched && website.hasError('pattern')) || (website.errors?.required && website.touched))}">
                    <input type="text" id="" name="website" #website="ngModel" [(ngModel)]="organizationObj.website"
                      [pattern]="websitePattern">
                  </div>
                  <div class="form-data">
                    <label>TaxNo</label>
                  </div>
                  <div class="form-data">
                    <input type="text" id="" name="taxNo" #taxNo="ngModel" [(ngModel)]="organizationObj.taxNo">
                  </div>
                  <div class="form-data">
                    <label for="">Person Name<span class="require">*</span></label>
                  </div>
                  <div class="form-data" [ngClass]="{ 'error': person.invalid  && (person.dirty || person.touched)}">
                    <input type="text" name="person" [(ngModel)]="organizationObj.person" #person="ngModel" id=""
                      required>
                  </div>
                  <div class="form-data">
                    <label for="">Email<span class="require">*</span></label>
                  </div>
                  <div class="form-data"
                    [ngClass]="{ 'error': email.invalid && ((email.touched && email.hasError('email')) || (email.errors?.required && email.touched))}">
                    <input type="email" name="email" [(ngModel)]="organizationObj.email" #email="ngModel" id="" required
                      email>
                  </div>
                  <div class="form-data">
                    <label for="">Mobile No<span class="require">*</span></label>
                  </div>
                  <div class="form-data"
                    [ngClass]="{ 'error': mobileNo.invalid && (mobileNo.errors?.required && mobileNo.touched) }">
                    <kendo-maskedtextbox name="mobileNo" [(ngModel)]="organizationObj.mobileNo" #mobileNo="ngModel"
                      id="" [mask]="mobileMask" required>
                    </kendo-maskedtextbox>
                  </div>
                  <div class="form-data">
                    <label for="">Phone No</label>
                  </div>
                  <div class="form-data">
                    <kendo-maskedtextbox name="phoneNo" #phoneNo="ngModel" [(ngModel)]="organizationObj.phoneNo" id=""
                      [mask]="phoneMask">
                    </kendo-maskedtextbox>
                  </div>
                  <div class="form-data">
                    <label for="">Fax No</label>
                  </div>
                  <div class="form-data">
                    <kendo-maskedtextbox name="faxNo" #faxNo="ngModel" [(ngModel)]="organizationObj.faxNo" id=""
                      [mask]="faxMask">
                    </kendo-maskedtextbox>
                  </div>
                </div>
              </div>
              <div class="i-form r-det">
                <h6 class="title"><i class="icon-creditlimit"></i>Details</h6>
                <div class="grid">
                  <div class="form-data">
                    <label>Amount</label>
                  </div>
                  <div class="form-data">
                    <input type="text" id="" name="amount" #amount="ngModel"
                      [(ngModel)]="organizationObj.creditLimit.amount" (keypress)="utilityService.numberOnly($event)">
                  </div>
                  <div class="form-data">
                    <label>Days</label>
                  </div>
                  <div class="form-data">
                    <input type="text" id="" name="days" #days="ngModel" [(ngModel)]="organizationObj.creditLimit.days"
                      (keypress)="utilityService.numberOnly($event)">
                  </div>
                </div>
              </div>
              <div class="i-form om-add">
                <h6 class="title"><i class="icon-mapmarker"></i>Address</h6>
                <div class="grid">
                  <div class="form-data">
                    <label>Line1</label>
                  </div>
                  <div class="form-data">
                    <textarea cols="4" type="text" id="" name="line1" #line1="ngModel"
                      [(ngModel)]="organizationObj.address.line1">
                                            </textarea>
                  </div>
                  <div class="form-data">
                    <label>Line2</label>
                  </div>
                  <div class="form-data">
                    <textarea cols="4" type="text" id="" name="line2" #line2="ngModel"
                      [(ngModel)]="organizationObj.address.line2">
                                            </textarea>
                  </div>
                  <div class="form-data">
                    <label>Type</label>
                  </div>
                  <div class="form-data">
                    <kendo-dropdownlist [data]="listAddressTypeItems" [valuePrimitive]="true" name="addressType"
                      #addressType="ngModel" [(ngModel)]="organizationObj.address.type">
                    </kendo-dropdownlist>
                  </div>
                  <div class="form-data">
                    <label>Country</label>
                  </div>
                  <div class="form-data">
                    <kendo-dropdownlist [data]="countryItems" [kendoDropDownFilter]="filterSettings"
                      [textField]="'name'" [valueField]="'name'" name="country" #country="ngModel"
                      (valueChange)="onCountryChange($event)" [valuePrimitive]="true"
                      [(ngModel)]="organizationObj.address.country">
                    </kendo-dropdownlist>
                  </div>
                  <div class="form-data">
                    <label>State</label>
                  </div>
                  <div class="form-data">
                    <kendo-dropdownlist [data]="stateItems" [kendoDropDownFilter]="filterSettings" [textField]="'name'"
                      [valueField]="'name'" (valueChange)="onStateChange($event)" [valuePrimitive]="true" name="state"
                      #state="ngModel" [(ngModel)]="organizationObj.address.state">
                    </kendo-dropdownlist>
                  </div>
                  <div class="form-data">
                    <label>City</label>
                  </div>
                  <div class="form-data">
                    <kendo-dropdownlist [data]="cityItems" [kendoDropDownFilter]="filterSettings" [textField]="'name'"
                      [valueField]="'name'" (valueChange)="onCityChange($event)" [valuePrimitive]="true" name="city"
                      #city="ngModel" [(ngModel)]="organizationObj.address.city">
                    </kendo-dropdownlist>
                  </div>
                  <div class="form-data">
                    <label>ZipCode</label>
                  </div>
                  <div class="form-data">
                    <input type="text" id="" name="zipcode" #zipcode="ngModel"
                      [(ngModel)]="organizationObj.address.zipCode">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button (click)="onOrgSubmit(organizationForm,false)" [disabled]="!organizationForm.valid"
            class="btn btn-primary"><i class="icon-add"></i>New</button>
          <button (click)="onOrgSubmit(organizationForm,true)" [disabled]="!organizationForm.valid"
            class="btn btn-primary"><i class="icon-save"></i>Save</button>
        </div>
      </div>
    </div>
    <div (document:keydown.esc)="closeRegOrganDialog(organizationForm)"></div>
  </form>
</div>
<!-- Register Organization Modal End -->

<ng-container *ngIf="isGridConfig">
  <app-gridconfiguration [fields]="fields" [pageName]="'Organization'" [gridName]="'OrganizationGrid'"
    [gridConfigId]="gridConfig ? gridConfig.id : undefined" (toggle)="isGridConfig=$event"
    (ChildEvent)="setNewGridConfig($event)">
  </app-gridconfiguration>
</ng-container>

<div kendoDialogContainer></div>
